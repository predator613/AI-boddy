name: ai-buddy

# Все значения имеют значения по умолчанию, поэтому `docker compose up --build`
# работает даже без файла .env (так проще жюри). Свои значения – в .env (см. .env.example).

services:
  postgres:
    image: pgvector/pgvector:pg16   # PostgreSQL 16 + расширение pgvector (пригодится для базы знаний)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buddy}
      POSTGRES_DB: ${POSTGRES_DB:-ai_buddy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buddy} -d ${POSTGRES_DB:-ai_buddy}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine   # пока не используется backend, нужен для следующих этапов (кеш, очереди)
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-buddy}:${POSTGRES_PASSWORD:-buddy}@postgres:5432/${POSTGRES_DB:-ai_buddy}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789}
      JWT_TTL: ${JWT_TTL:-24h}
      DEMO_MODE: ${DEMO_MODE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Тесты backend + отчет о покрытии в backend/coverage/.
  # Запуск: docker compose --profile test run --rm backend-tests
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-buddy}:${POSTGRES_PASSWORD:-buddy}@postgres:5432/ai_buddy_test?sslmode=disable
    volumes:
      - ./backend/coverage:/coverage
    depends_on:
      postgres:
        condition: service_healthy

  # Веб-интерфейс: сборка React-приложения и раздача статики через nginx.
  # Открыть: http://localhost:3000
  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Тесты frontend + отчет о покрытии в frontend/coverage/.
  # Запуск: docker compose --profile test run --rm frontend-tests
  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test
    volumes:
      - ./frontend/coverage:/coverage

  # Сюда позже добавятся agent и mock-services.

volumes:
  pgdata:
