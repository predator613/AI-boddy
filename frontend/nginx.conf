server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Заголовки защиты: браузер не угадывает тип файла, страницу нельзя встроить во фрейм,
  # адрес не уходит в Referer на сторонние сайты.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # SPA: любые пути отдаем index.html, дальше маршрутизирует TanStack Router
  location / {
    try_files $uri $uri/ /index.html;
  }

  # статика с хешем в имени кешируется надолго
  # (add_header внутри location отменяет заголовки сервера, поэтому они повторены)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }
}
