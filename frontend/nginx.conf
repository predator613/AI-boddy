server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: любые пути отдаем index.html, дальше маршрутизирует TanStack Router
  location / {
    try_files $uri $uri/ /index.html;
  }

  # статика с хешем в имени кешируется надолго
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
